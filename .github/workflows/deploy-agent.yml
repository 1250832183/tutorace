name: Deploy LiveKit Agent

on:
  push:
    branches:
      - main
    paths:
      - 'agent/**'
      - '.github/workflows/deploy-agent.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install LiveKit CLI
        run: |
          curl -sSL https://get.livekit.io/cli | bash

      - name: Configure LiveKit Project
        run: |
          lk project add tutorace \
            --api-key ${{ secrets.LIVEKIT_API_KEY }} \
            --api-secret ${{ secrets.LIVEKIT_API_SECRET }} \
            --url ${{ secrets.LIVEKIT_URL }} \
            --default

      - name: Deploy Agent to LiveKit Cloud
        working-directory: ./agent
        run: |
          lk agent deploy \
            --secrets "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},CARTESIA_API_KEY=${{ secrets.CARTESIA_API_KEY }}" \
            --non-interactive

      - name: Check Agent Status
        run: |
          sleep 10
          lk agent status
